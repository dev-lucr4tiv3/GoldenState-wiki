<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" fill="none">
  <rect width="1200" height="400" fill="#0d0d0d"/>
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#CF9F3E" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0d0d0d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d0d0d" stop-opacity="1"/>
      <stop offset="40%" stop-color="#0d0d0d" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0d0d0d" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <ellipse cx="850" cy="200" rx="380" ry="280" fill="url(#glow)"/>
  <!-- Scale of justice icon -->
  <g transform="translate(800, 60)" opacity="0.9">
    <!-- Beam -->
    <line x1="100" y1="60" x2="100" y2="270" stroke="#CF9F3E" stroke-width="2.5"/>
    <line x1="20" y1="100" x2="180" y2="100" stroke="#CF9F3E" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Left pan -->
    <line x1="20" y1="100" x2="20" y2="170" stroke="#CF9F3E" stroke-width="1.5" stroke-dasharray="4,3"/>
    <path d="M0 170 Q20 190 40 170" stroke="#CF9F3E" stroke-width="2" fill="none"/>
    <!-- Right pan (lower) -->
    <line x1="180" y1="100" x2="180" y2="190" stroke="#CF9F3E" stroke-width="1.5" stroke-dasharray="4,3"/>
    <path d="M160 190 Q180 210 200 190" stroke="#CF9F3E" stroke-width="2" fill="none"/>
    <!-- Base -->
    <path d="M70 270 L130 270" stroke="#CF9F3E" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Top -->
    <circle cx="100" cy="60" r="6" stroke="#CF9F3E" stroke-width="2" fill="none"/>
  </g>
  <rect x="0" y="0" width="1200" height="400" fill="url(#fade)"/>
  <text x="80" y="170" font-family="system-ui, sans-serif" font-size="13" font-weight="600" letter-spacing="6" fill="#CF9F3E" opacity="0.7">REGELWERK</text>
  <text x="80" y="230" font-family="system-ui, sans-serif" font-size="38" font-weight="700" fill="#F5F5F5">Regeln für ein</text>
  <text x="80" y="278" font-family="system-ui, sans-serif" font-size="38" font-weight="700" fill="#F5F5F5">faires Miteinander.</text>
</svg>
