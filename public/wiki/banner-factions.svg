<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" fill="none">
  <rect width="1200" height="400" fill="#0d0d0d"/>
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#CF9F3E" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#0d0d0d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d0d0d" stop-opacity="1"/>
      <stop offset="40%" stop-color="#0d0d0d" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0d0d0d" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <ellipse cx="850" cy="200" rx="380" ry="280" fill="url(#glow)"/>
  <!-- Three person silhouettes -->
  <g transform="translate(780, 70)" opacity="0.9">
    <!-- Center person -->
    <circle cx="120" cy="80" r="28" stroke="#CF9F3E" stroke-width="2.5" fill="none"/>
    <path d="M60 270 C60 210 80 190 120 190 C160 190 180 210 180 270" stroke="#CF9F3E" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Left person -->
    <circle cx="30" cy="100" r="22" stroke="#CF9F3E" stroke-width="2" fill="none" opacity="0.65"/>
    <path d="M-20 270 C-20 220 -5 205 30 205 C65 205 80 220 80 270" stroke="#CF9F3E" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.65"/>
    <!-- Right person -->
    <circle cx="210" cy="100" r="22" stroke="#CF9F3E" stroke-width="2" fill="none" opacity="0.65"/>
    <path d="M160 270 C160 220 175 205 210 205 C245 205 260 220 260 270" stroke="#CF9F3E" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.65"/>
  </g>
  <rect x="0" y="0" width="1200" height="400" fill="url(#fade)"/>
  <text x="80" y="170" font-family="system-ui, sans-serif" font-size="13" font-weight="600" letter-spacing="6" fill="#CF9F3E" opacity="0.7">FRAKTIONEN</text>
  <text x="80" y="230" font-family="system-ui, sans-serif" font-size="38" font-weight="700" fill="#F5F5F5">Gemeinschaft und</text>
  <text x="80" y="278" font-family="system-ui, sans-serif" font-size="38" font-weight="700" fill="#F5F5F5">Organisation.</text>
</svg>
