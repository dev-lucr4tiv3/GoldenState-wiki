<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" fill="none">
  <rect width="1200" height="400" fill="#0d0d0d"/>
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#CF9F3E" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#0d0d0d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d0d0d" stop-opacity="1"/>
      <stop offset="40%" stop-color="#0d0d0d" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0d0d0d" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <ellipse cx="850" cy="200" rx="380" ry="280" fill="url(#glow)"/>
  <!-- Life buoy / support ring -->
  <g transform="translate(820, 80)" opacity="0.9">
    <circle cx="120" cy="120" r="100" stroke="#CF9F3E" stroke-width="2.5" fill="none"/>
    <circle cx="120" cy="120" r="58" stroke="#CF9F3E" stroke-width="2.5" fill="none"/>
    <line x1="49" y1="49" x2="83" y2="83" stroke="#CF9F3E" stroke-width="2" opacity="0.5"/>
    <line x1="191" y1="49" x2="157" y2="83" stroke="#CF9F3E" stroke-width="2" opacity="0.5"/>
    <line x1="49" y1="191" x2="83" y2="157" stroke="#CF9F3E" stroke-width="2" opacity="0.5"/>
    <line x1="191" y1="191" x2="157" y2="157" stroke="#CF9F3E" stroke-width="2" opacity="0.5"/>
  </g>
  <rect x="0" y="0" width="1200" height="400" fill="url(#fade)"/>
  <text x="80" y="170" font-family="system-ui, sans-serif" font-size="13" font-weight="600" letter-spacing="6" fill="#CF9F3E" opacity="0.7">SUPPORT</text>
  <text x="80" y="230" font-family="system-ui, sans-serif" font-size="38" font-weight="700" fill="#F5F5F5">Wir sind für</text>
  <text x="80" y="278" font-family="system-ui, sans-serif" font-size="38" font-weight="700" fill="#F5F5F5">dich da.</text>
</svg>
